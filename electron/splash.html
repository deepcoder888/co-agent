<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CO-AGENT</title>
<style>
  /* v0.32 splash window (2026-10-22, version C). Design source: docs/design/v0.32-splash/splash-c.html.
     The window is 640x400, frameless and transparent; only the rounded card is painted. */
  html, body { margin: 0; width: 640px; height: 400px; overflow: hidden; background: transparent; }
  .skip { position: absolute; right: 16px; bottom: 12px; font-size: 11px; color: #9a8f7c; letter-spacing: 1px;
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif; animation: fade .4s ease-out 1s; }

  /* ---- Splash: 640x400, version C ---- */
  .splash { position: relative; width: 640px; height: 400px; overflow: hidden; border-radius: 16px; background: #f3ecdc;
    color: #2a2622; font-family: 'Noto Serif SC', 'Source Han Serif SC', serif; cursor: pointer; user-select: none; }
  .splash svg { position: absolute; inset: 0; display: block; }
  /* The animation shorthands below would reset fill-mode; every element must hold its first frame during its delay. */
  .splash * { animation-fill-mode: both !important; }
  .fill-box { transform-box: fill-box; transform-origin: center; }

  /* 0.0–0.5 s  C1: paper and hills appear, the rolled scroll settles */
  .hills { animation: fade .8s ease-out 0s; }
  .scroll { animation: settle .5s cubic-bezier(.2, .7, .3, 1) .1s; }
  .tie { animation: fade-out .15s linear .5s; }

  /* 0.5–1.2 s  C2: the hanging scroll opens from the middle, rods move apart */
  .paper { transform-box: fill-box; transform-origin: center; animation: unroll .7s cubic-bezier(.45, 0, .2, 1) .5s; }
  .rod-top { animation: rod-top .7s cubic-bezier(.45, 0, .2, 1) .5s; }
  .rod-bottom { animation: rod-bottom .7s cubic-bezier(.45, 0, .2, 1) .5s; }

  /* 1.05–1.8 s  ink columns appear right to left; then they dim for the ensō */
  .col { transform-box: fill-box; transform-origin: 50% 0; animation: ink .32s ease-out; }
  .text { animation: dim .4s ease-in-out 1.8s; }

  /* 1.75–2.35 s  C3: three ensō are brushed in, overlapping */
  .enso-stroke { animation: brush .5s cubic-bezier(.5, 0, .3, 1); }
  .enso-thin { animation: brush-thin .5s cubic-bezier(.5, 0, .3, 1); }

  /* 2.35–2.95 s  C4: the scroll withdraws, the ensō gather behind the seal */
  .scroll-out { transform-box: view-box; transform-origin: 320px 200px; animation: withdraw .55s ease-in 2.35s; }
  .ensos { transform-box: view-box; transform-origin: 320px 196px; animation: gather .6s cubic-bezier(.4, 0, .2, 1) 2.35s; }

  /* 2.6 s  the seal stamps down; 2.75–3.2 s  the wordmark is written beside it */
  .seal { animation: stamp .32s cubic-bezier(.3, 1.4, .5, 1) 2.6s; }
  .wordmark { position: absolute; left: 276px; top: 134px; display: flex; flex-direction: column; gap: 10px; }
  .wordmark .name { font-size: 42px; font-weight: 700; letter-spacing: 3px; line-height: 1; animation: write .5s ease-out 2.75s; }
  .wordmark .motto { font-size: 15px; color: #6f6656; letter-spacing: 5px; animation: fade .45s ease-out 3.05s; }

  /* 3.1 s on  loading state while the main window prepares */
  .loading { animation: fade .4s ease-out 3.1s; }
  .loading-ink { animation: shuttle 1.2s ease-in-out 3.1s infinite alternate; }
  .status { position: absolute; left: 0; right: 0; top: 332px; text-align: center; font-size: 12px; color: #6f6656; letter-spacing: 2px;
    animation: fade .4s ease-out 3.1s; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes settle { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes unroll { from { transform: scaleY(.04); } to { transform: none; } }
  @keyframes rod-top { from { transform: translateY(98px); } to { transform: none; } }
  @keyframes rod-bottom { from { transform: translateY(-98px); } to { transform: none; } }
  @keyframes ink { from { opacity: 0; transform: scaleY(0); } to { opacity: 1; transform: none; } }
  @keyframes dim { from { opacity: 1; } to { opacity: .22; } }
  @keyframes brush { 0% { opacity: 0; stroke-dasharray: 0 100; } 12% { opacity: 1; } 100% { opacity: 1; stroke-dasharray: 89 11; } }
  @keyframes brush-thin { 0% { opacity: 0; stroke-dasharray: 0 100; } 12% { opacity: 1; } 100% { opacity: 1; stroke-dasharray: 70 30; } }
  @keyframes withdraw { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.94); } }
  @keyframes gather { from { opacity: 1; transform: none; } to { opacity: .4; transform: translate(-112px, -32px) scale(.87); } }
  @keyframes stamp { 0% { opacity: 0; transform: scale(1.35); } 60% { opacity: 1; transform: scale(.96); } 100% { opacity: 1; transform: none; } }
  @keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes shuttle { from { transform: translateX(0); } to { transform: translateX(140px); } }

  /* Reduced motion: show the final frame at once (the loading ink stays still). */
  @media (prefers-reduced-motion: reduce) {
    .splash *, .splash { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
  /* v0.32.1: nothing moves until the window is on screen (a not-yet-shown window would otherwise run the clock). */
  .splash:not(.play), .splash:not(.play) * { animation-play-state: paused !important; }
</style>
</head>
<body>

  <div class="wordmark">
    <div class="name">CO-AGENT</div>

  </div>
  <div class="status">正在展卷…</div>
  <div class="skip">点击跳过</div>
</div>
<script>
  // The main process watches in-page navigation: #done after the whole animation has played (the motto is the
  // last element to finish) plus a short rest on the final frame, #skip when clicked.
  const splash = document.getElementById('splash');
  const rest = matchMedia('(prefers-reduced-motion: reduce)').matches ? 800 : 500;
  let started = false;
  const play = () => { if (!started) { started = true; splash.classList.add('play'); } };
  if (document.visibilityState === 'visible') play();
  else document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') play(); });
  setTimeout(play, 1500);
  splash.querySelector('.motto').addEventListener('animationend', () => {
    setTimeout(() => { if (location.hash !== '#skip') location.hash = 'done'; }, rest);
  });
  document.addEventListener('click', () => { location.hash = 'skip'; });
</script>
</body>
